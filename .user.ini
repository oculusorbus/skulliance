; Move PHP session files out of CageFS's hidden /tmp and into a path
; under the user's home directory. This makes the files visible to
; SSH/cPanel commands (du, find, ls) and lets a cleanup cron prune
; abandoned sessions directly.
;
; The directory must exist on the server before this takes effect:
;   mkdir -p /home/jeremiah/php-sessions-skulliance
;   chmod 700 /home/jeremiah/php-sessions-skulliance
;
; After uploading, suggested cleanup cron (weekly, 4am Sunday,
; removes files older than 35 days — past the 31-day login lifetime
; set in process-oauth.php):
;
;   0 4 * * 0 find /home/jeremiah/php-sessions-skulliance -type f -mtime +35 -delete
session.save_path = "/home/jeremiah/php-sessions-skulliance"

; ---------------------------------------------------------------------------
; UPLOADS. The admin pages accept theme backgrounds, logos and mission art,
; and the host defaults (commonly 8M post / 2M file) are smaller than a
; single piece of source art.
;
; THE FAILURE THIS FIXES IS SILENT AND LOOKS LIKE SOMETHING ELSE. When a POST
; exceeds post_max_size, PHP discards $_POST AND $_FILES before any script
; runs -- no warning, no entry in $_FILES['...']['error']. The page sees an
; empty form and reports whichever field it checks first as missing, so
; "the title is required" was really "your image was too big". admin-
; monstrocity.php now detects that case by name, but the limits should be
; big enough that it rarely comes up.
;
; post_max_size must exceed upload_max_filesize, and by enough to cover more
; than one file: the theme form posts a background AND a logo together.
upload_max_filesize = 32M
post_max_size = 72M
