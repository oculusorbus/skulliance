<!DOCTYPE html>
<html>
<head>
  <title>Skull Racer</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Presentation build -- player-facing only, no dev/tuning controls.
       The full-featured version with every slider + the FPS/performance
       readout still exists at dev.html, for tuning work, not for players. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #07111d;
      font-family: Arial, sans-serif;
      color: #e8eaed;
      padding: 20px;
    }
    #stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap; /* narrow viewports stack instead of overflowing sideways */
    }
    .box-art {
      display: block;
      max-height: 480px;
      width: auto;
      max-width: 260px;
      border-radius: 0.5rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    #frame {
      background-color: #0a1929;
      border: 1px solid rgba(0,200,160,0.25);
      border-radius: 0.75rem;
      padding: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #racer {
      position: relative;
      /* Fill as much of the browser window as the 4:3 canvas aspect ratio
         allows, in whichever dimension is the tighter constraint -- 85vh
         converted to an equivalent width (*4/3) so a tall/narrow window is
         limited by height, a short/wide one by width, and it's never
         bigger than either. Was a flat 640px; a big monitor just had empty
         space around a small fixed game area. */
      width: min(92vw, 85vh * 4 / 3);
      max-width: 1800px; /* sane ceiling on an ultrawide/4K display */
      line-height: 0; /* kill the baseline gap under the canvas */
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: linear-gradient(rgba(7,17,29,0.85), rgba(7,17,29,0));
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      pointer-events: none;
      z-index: 1;
    }
    #hud .hud { color: #e8eaed; }
    #hud .value { color: #00c8a0; font-weight: bold; }
    #fast_lap_time.fastest .value,
    #last_lap_time.fastest .value { color: #ffcc4d; }
    #canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      border-radius: 0.5rem;
      background-color: #000000;
    }
    #instructions {
      margin-top: 12px;
      text-align: center;
      color: rgba(232,234,237,0.6);
      font-size: 0.85rem;
    }
    #instructions b { color: #00c8a0; }
    #mute {
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 2;
      width: 32px;
      height: 32px;
      background-position: 0px 0px;
      background: url(images/mute.png);
      display: inline-block;
      cursor: pointer;
      opacity: 0.85;
    }
    #mute:hover { opacity: 1; }
    #mute.on { background-position: -32px 0px; }
    #finish-overlay {
      display: none;
      position: absolute;
      z-index: 3;
      top: 0; left: 0; right: 0; bottom: 0;
      align-items: center;
      justify-content: center;
      background: rgba(7,17,29,0.85);
      border-radius: 0.5rem;
    }
    #finish-overlay.show { display: flex; }
    #finish-box {
      text-align: center;
      background-color: #0a1929;
      border: 1px solid rgba(0,200,160,0.4);
      border-radius: 0.75rem;
      padding: 24px 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      line-height: normal; /* #racer sets line-height:0 to kill the gap under
                               the canvas -- inherited here it collapsed the
                               two finish-row lines on top of each other */
    }
    #finish-box h2 {
      margin: 0 0 14px;
      color: #00c8a0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 300;
    }
    #finish-box .finish-row {
      margin: 6px 0;
      color: #e8eaed;
      font-size: 0.9rem;
    }
    #finish-box .value { color: #00c8a0; font-weight: bold; margin-left: 6px; }
    #finish-replay {
      margin-top: 16px;
      padding: 8px 20px;
      background-color: #00c8a0;
      border: none;
      border-radius: 0.4rem;
      color: #07111d;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      font-size: 0.85rem;
    }
    #finish-replay:hover { background-color: #00e0b4; }

    #touch-controls { display: none; } /* shown only in the mobile media query below */
    .mobile-hint { display: none; }

    @media (max-width: 768px) {
      body { padding: 8px; }
      .box-art { display: none; } /* no room next to the game on a phone -- focus on the canvas + touch controls */
      #stage { gap: 0; width: 100%; }
      #frame { width: 100%; padding: 8px; }
      #racer { width: 100%; }
      #hud { font-size: 0.7rem; padding: 6px 8px; }
      .desktop-hint { display: none; }
      .mobile-hint { display: inline; }
      /* Press-and-hold buttons instead of a drag joystick -- switching
         direction on a drag control means your thumb's contact patch has
         to physically slide against the glass every single time, which
         adds up over a whole race. A press-and-hold button is just contact
         vs. no contact, no scrubbing. */
      #touch-controls { display: flex; gap: 8px; margin-top: 10px; }
      .touch-btn {
        flex: 1;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,200,160,0.08);
        border: 1px solid rgba(0,200,160,0.3);
        border-radius: 0.5rem;
        color: #00c8a0;
        font-size: 1.5rem;
        font-weight: bold;
        letter-spacing: 0.05em;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none; /* stop the page from scrolling/zooming while a button is held */
      }
      .touch-btn.pressed { background-color: #00c8a0; color: #07111d; }
      #btn-brake { font-size: 0.8rem; }
      #btn-brake.pressed { background-color: #ff4d4d; border-color: #ff4d4d; color: #07111d; }
    }
  </style>
</head>
<body>

  <div id="stage">
    <img class="box-art" id="box-art-left"  src="images/skullracer.jpg" alt="Skull Racer box art -- front">

    <div id="frame">
      <div id="racer">
        <div id="hud">
          <span id="lap"              class="hud">Lap <span id="lap_value" class="value">1</span>/<span id="total_laps_value" class="value">2</span></span>
          <span id="speed"            class="hud"><span id="speed_value" class="value">0</span> mph</span>
          <span id="current_lap_time" class="hud">Time: <span id="current_lap_time_value" class="value">0.0</span></span>
          <span id="last_lap_time"    class="hud">Last Lap: <span id="last_lap_time_value" class="value">0.0</span></span>
          <span id="fast_lap_time"    class="hud">Fastest Lap: <span id="fast_lap_time_value" class="value">0.0</span></span>
        </div>
        <canvas id="canvas">
          Sorry, this example cannot be run because your browser does not support the &lt;canvas&gt; element
        </canvas>
        <div id="finish-overlay">
          <div id="finish-box">
            <h2>Race Complete</h2>
            <p class="finish-row">Total Time <span id="finish_total_time" class="value">0.0</span></p>
            <p class="finish-row">Fastest Lap <span id="finish_fastest_lap" class="value">0.0</span></p>
            <button id="finish-replay" type="button">Race Again</button>
          </div>
        </div>
      </div>
      <div id="instructions">
        <span class="desktop-hint">Use the <b>arrow keys</b> to drive.</span>
        <span class="mobile-hint">Driving is automatic -- hold <b>&#9664;</b>/<b>&#9654;</b> to steer, <b>BRAKE</b> to slow down.</span>
      </div>
      <div id="touch-controls">
        <div class="touch-btn" id="btn-left">&#9664;</div>
        <div class="touch-btn" id="btn-brake">BRAKE</div>
        <div class="touch-btn" id="btn-right">&#9654;</div>
      </div>
    </div>

    <img class="box-art" id="box-art-right" src="images/backcover.jpg" alt="Skull Racer box art -- back">
  </div>

  <audio id='music'>
    <source src="music/skull-racer-theme.mp3"><!-- 1/2/3 cycled in via common.js after each ends --></source>
  </audio>
  <!-- Collision SFX -- synthesized (no engine/collision sound existed
       anywhere in this codebase before, confirmed by grep across every
       version). Trial run, wired into this presentation build only.
       Engine sound is Web Audio API instead of a plain <audio> element
       (see the script below) -- <audio loop> isn't sample-accurate in
       most browsers, it actually restarts with an audible gap each
       cycle, which is exactly the "chugging with pauses" that was wrong
       with the first attempt. -->
  <audio id='collision-sound'>
    <source src="sounds/collision.wav" type="audio/wav">
  </audio>
  <span id="mute"></span>

  <script src="common.js"></script>
  <script src="sounds/engine-data.js"></script>
  <script>

    var fps            = 60;                      // how many 'update' frames per second
    var step           = 1/fps;                   // how long is each frame (in seconds)
    var width          = 1024;                    // logical canvas width
    var height         = 768;                     // logical canvas height
    var centrifugal    = 0.3;                     // centrifugal force multiplier when going around curves
    var offRoadDecel   = 0.99;                    // speed multiplier when off road (e.g. you lose 2% speed each update frame)
    var skySpeed       = 0.001;                   // background sky layer scroll speed when going around curve (or up hill)
    var hillSpeed      = 0.002;                   // background hill layer scroll speed when going around curve (or up hill)
    var treeSpeed      = 0.003;                   // background tree layer scroll speed when going around curve (or up hill)
    var skyOffset      = 0;                       // current sky scroll offset
    var hillOffset     = 0;                       // current hill scroll offset
    var treeOffset     = 0;                       // current tree scroll offset
    var segments       = [];                      // array of road segments
    var cars           = [];                      // array of cars on the road
    var canvas         = Dom.get('canvas');       // our canvas...
    var ctx            = canvas.getContext('2d'); // ...and its drawing context
    var background     = null;                    // our background image (loaded below)
    var sprites        = null;                    // our spritesheet (loaded below)
    var resolution     = null;                    // scaling factor to provide resolution independence (computed)
    var roadWidth      = 2000;                    // actually half the roads width, easier math if the road spans from -roadWidth to +roadWidth
    var segmentLength  = 200;                     // length of a single segment
    var rumbleLength   = 3;                       // number of segments per red/white rumble strip
    var trackLength    = null;                    // z length of entire track (computed)
    var lanes          = 3;                       // number of lanes
    var fieldOfView    = 100;                     // angle (degrees) for field of view
    var cameraHeight   = 1000;                    // z height of camera
    var cameraDepth    = null;                    // z distance camera is from screen (computed)
    var drawDistance   = 300;                     // number of segments to draw
    var playerX        = 0;                       // player x offset from center of road (-1 to 1 to stay independent of roadWidth)
    var playerZ        = null;                    // player relative z distance from camera (computed)
    var fogDensity     = 5;                       // exponential fog density
    var position       = 0;                       // current camera Z position (add playerZ to get player's absolute Z position)
    var speed          = 0;                       // current speed
    var maxSpeed       = segmentLength/step;      // top speed (ensure we can't move more than 1 segment in a single frame to make collision detection easier)
    var accel          =  maxSpeed/5;             // acceleration rate - tuned until it 'felt' right
    var breaking       = -maxSpeed;               // deceleration rate when braking
    var decel          = -maxSpeed/5;             // 'natural' deceleration rate when neither accelerating, nor braking
    var offRoadDecel   = -maxSpeed/2;             // off road deceleration is somewhere in between
    var offRoadLimit   =  maxSpeed/4;             // limit when off road deceleration no longer applies (e.g. you can always go at least this speed even when off road)
    var totalCars      = 200;                     // total number of cars on the road
    var currentLapTime = 0;                       // current lap time
    var lastLapTime    = null;                    // last lap time

    // The original codebase had no finish -- the track just looped forever.
    // 2 laps is sized against the music: the 4 chiptune tracks run ~505s back
    // to back (159s theme + 114s + 114s + 119s, confirmed via afinfo), and the
    // game's own placeholder "fastest lap" default (see Dom.storage.fast_lap_time
    // below) has always assumed ~180s as a normal lap time. 2 laps lands most
    // players' races in the 360-500s range -- long enough to hear all 4 tracks
    // at least start, short enough not to be a slog for a first-look build.
    var totalLaps      = 2;                       // laps to complete before the race ends
    var lapNumber      = 1;                       // current lap (1-indexed)
    var raceElapsed    = 0;                       // total race time, counts continuously across all laps
    var raceFinished   = false;                   // true once the final lap is crossed -- update() stops doing anything

    var keyLeft        = false;
    var keyRight       = false;
    var keyFaster      = false;
    var keySlower      = false;

    //=========================================================================
    // TOUCH CONTROLS (mobile) -- drives the exact same keyLeft/keyRight/
    // keyFaster/keySlower flags the keyboard bindings below set, just from
    // 3 press-and-hold buttons instead of a drag joystick. A drag control
    // (tried first) meant switching direction required your thumb's
    // contact patch to physically slide against the glass every single
    // time, repeatedly, over a whole race -- a real, reported physical
    // annoyance. A hold-button is just contact vs. no contact, nothing to
    // drag. Driving is automatic (keyFaster stays true) so there's nothing
    // to hold just to go forward -- only touch when you need to steer or
    // brake, and any combination of left/right + brake at once works, same
    // as holding multiple arrow keys together.
    //
    // These 3 buttons exist in the DOM on every page load, mobile or not
    // (so no separate "is this mobile" JS check is needed for THEM), but
    // are display:none outside the mobile media query -- that's what the
    // computed-style check below actually guards against, since a hidden
    // element still exists and touch listeners on it would otherwise
    // silently do nothing useful.
    //=========================================================================

    (function() {
      var btnLeft   = Dom.get('btn-left');
      var btnRight  = Dom.get('btn-right');
      var btnBrake  = Dom.get('btn-brake');
      var container = Dom.get('touch-controls');
      if (!btnLeft || getComputedStyle(container).display === 'none') return; // desktop -- arrow keys handle it instead

      keyFaster = true; // see comment above -- mobile drives automatically unless braking

      function bindHold(el, onPress, onRelease) {
        function press(e)   { e.preventDefault(); onPress();   Dom.addClassName(el, 'pressed'); }
        function release(e) { e.preventDefault(); onRelease(); Dom.removeClassName(el, 'pressed'); }
        el.addEventListener('touchstart',  press,   { passive: false });
        el.addEventListener('touchend',    release, { passive: false });
        el.addEventListener('touchcancel', release, { passive: false });
      }

      bindHold(btnLeft,  function() { keyLeft  = true;  }, function() { keyLeft  = false; });
      bindHold(btnRight, function() { keyRight = true;  }, function() { keyRight = false; });
      bindHold(btnBrake, function() { keySlower = true;  keyFaster = false; },
                          function() { keySlower = false; keyFaster = true;  });
    })();

    var hud = {
      speed:            { value: null, dom: Dom.get('speed_value')            },
      lap:              { value: null, dom: Dom.get('lap_value')              },
      current_lap_time: { value: null, dom: Dom.get('current_lap_time_value') },
      last_lap_time:    { value: null, dom: Dom.get('last_lap_time_value')    },
      fast_lap_time:    { value: null, dom: Dom.get('fast_lap_time_value')    }
    }

    //=========================================================================
    // ENGINE / COLLISION SFX (trial synthesized sounds, not part of the
    // original codebase -- confirmed there was never any before). Kept
    // separate from Game.playMusic() in common.js on purpose, so this
    // stays scoped to this presentation build only.
    //=========================================================================

    var collisionSound = Dom.get('collision-sound');
    collisionSound.volume = 0.25; // was unset (1.0), then 0.4 -- still louder than music, dropped again

    // Engine sound via the Web Audio API, not a plain <audio loop> element --
    // AudioBufferSourceNode.loop is sample-accurate (genuinely gapless);
    // <audio loop> is not, in most browsers it actually restarts with a
    // small but audible gap every cycle, which is exactly the "same sound
    // over and over with pauses" problem the first attempt had.
    var audioCtx        = new (window.AudioContext || window.webkitAudioContext)();
    var engineGain       = audioCtx.createGain();
    engineGain.gain.value = 0;
    engineGain.connect(audioCtx.destination);
    var engineBuffer     = null; // set once decoded -- may finish before OR after the first interaction
    var engineSourceNode = null; // only exists once actually started
    var readyToStartEngine = false;

    // Decoded from the inline base64 copy (sounds/engine-data.js), not
    // fetch()'d -- fetch()/XHR of a local file is blocked by Chrome's CORS
    // rules when this page is opened directly via file:// (no server),
    // which silently killed the engine sound for exactly that reason while
    // the music/collision <audio> elements (unaffected by that restriction)
    // played fine.
    var engineRaw = atob(ENGINE_WAV_BASE64);
    var engineBytes = new Uint8Array(engineRaw.length);
    for (var i = 0; i < engineRaw.length; i++) engineBytes[i] = engineRaw.charCodeAt(i);
    audioCtx.decodeAudioData(engineBytes.buffer)
      .then(function(audioBuffer) {
        engineBuffer = audioBuffer;
        if (readyToStartEngine) startEngineSound(); // interaction already happened while this was still decoding
      });

    function startEngineSound() {
      audioCtx.resume(); // AudioContext itself starts 'suspended' until a real user gesture, same autoplay rule as <audio>
      readyToStartEngine = true;
      if (!engineBuffer || engineSourceNode) return; // not decoded yet (will start itself above once it is), or already started
      var src = audioCtx.createBufferSource();
      src.buffer = engineBuffer;
      src.loop   = true;
      src.connect(engineGain);
      src.start(0);
      engineSourceNode = src;
    }

    function updateEngineSound(speedPercent) {
      if (!engineSourceNode) return; // buffer still loading
      // Narrower range than before (was 0.7-2.0x of a 90Hz source -- topped
      // out at 180Hz, a high-pitched "lawnmower" whine that drowned out the
      // music). Source is now a deeper 60Hz tone and only ranges up to 1.6x
      // (96Hz), staying a low rumble even at top speed.
      engineSourceNode.playbackRate.value = 0.8 + speedPercent * 0.8;
      engineGain.gain.value = engineMuted ? 0 : (0.05 + speedPercent * 0.12);
    }

    var engineMuted = (Dom.storage.muted === "true");

    function playCollisionSound() {
      collisionSound.currentTime = 0;
      collisionSound.play();
    }

    //=========================================================================
    // UPDATE THE GAME WORLD
    //=========================================================================

    function update(dt) {

      if (raceFinished) return; // Game.stop() halts the loop after finishRace(), but belt-and-suspenders

      var n, car, carW, sprite, spriteW;
      var playerSegment = findSegment(position+playerZ);
      var playerW       = SPRITES.PLAYER_STRAIGHT.w * SPRITES.SCALE;
      var speedPercent  = speed/maxSpeed;
      var dx            = dt * 2 * speedPercent; // at top speed, should be able to cross from left to right (-1 to 1) in 1 second
      var startPosition = position;

      updateCars(dt, playerSegment, playerW);

      position = Util.increase(position, dt * speed, trackLength);

      if (keyLeft)
        playerX = playerX - dx;
      else if (keyRight)
        playerX = playerX + dx;

      playerX = playerX - (dx * speedPercent * playerSegment.curve * centrifugal);

      if (keyFaster)
        speed = Util.accelerate(speed, accel, dt);
      else if (keySlower)
        speed = Util.accelerate(speed, breaking, dt);
      else
        speed = Util.accelerate(speed, decel, dt);


      if ((playerX < -1) || (playerX > 1)) {

        if (speed > offRoadLimit)
          speed = Util.accelerate(speed, offRoadDecel, dt);

        for(n = 0 ; n < playerSegment.sprites.length ; n++) {
          sprite  = playerSegment.sprites[n];
          spriteW = sprite.source.w * SPRITES.SCALE;
          if (Util.overlap(playerX, playerW, sprite.offset + spriteW/2 * (sprite.offset > 0 ? 1 : -1), spriteW)) {
            speed = maxSpeed/5;
            position = Util.increase(playerSegment.p1.world.z, -playerZ, trackLength); // stop in front of sprite (at front of segment)
            playCollisionSound();
            break;
          }
        }
      }

      for(n = 0 ; n < playerSegment.cars.length ; n++) {
        car  = playerSegment.cars[n];
        carW = car.sprite.w * SPRITES.SCALE;
        if (speed > car.speed) {
          if (Util.overlap(playerX, playerW, car.offset, carW, 0.8)) {
            speed    = car.speed * (car.speed/speed);
            position = Util.increase(car.z, -playerZ, trackLength);
            playCollisionSound();
            break;
          }
        }
      }

      playerX = Util.limit(playerX, -3, 3);     // dont ever let it go too far out of bounds
      speed   = Util.limit(speed, 0, maxSpeed); // or exceed maxSpeed

      updateEngineSound(speed/maxSpeed);

      skyOffset  = Util.increase(skyOffset,  skySpeed  * playerSegment.curve * (position-startPosition)/segmentLength, 1);
      hillOffset = Util.increase(hillOffset, hillSpeed * playerSegment.curve * (position-startPosition)/segmentLength, 1);
      treeOffset = Util.increase(treeOffset, treeSpeed * playerSegment.curve * (position-startPosition)/segmentLength, 1);

      if (position > playerZ) {
        raceElapsed += dt; // unlike currentLapTime, this never resets -- it's the total race clock shown at the finish
        if (currentLapTime && (startPosition < playerZ)) {
          lastLapTime    = currentLapTime;
          currentLapTime = 0;
          if (lastLapTime <= Util.toFloat(Dom.storage.fast_lap_time)) {
            Dom.storage.fast_lap_time = lastLapTime;
            updateHud('fast_lap_time', formatTime(lastLapTime));
            Dom.addClassName('fast_lap_time', 'fastest');
            Dom.addClassName('last_lap_time', 'fastest');
          }
          else {
            Dom.removeClassName('fast_lap_time', 'fastest');
            Dom.removeClassName('last_lap_time', 'fastest');
          }
          updateHud('last_lap_time', formatTime(lastLapTime));
          Dom.show('last_lap_time');

          if (lapNumber >= totalLaps) {
            finishRace();
            return;
          }
          lapNumber++;
          updateHud('lap', lapNumber);
        }
        else {
          currentLapTime += dt;
        }
      }

      updateHud('speed',            5 * Math.round(speed/500));
      updateHud('current_lap_time', formatTime(currentLapTime));
    }

    //-------------------------------------------------------------------------

    function finishRace() {
      raceFinished = true;
      speed        = 0;
      keyLeft = keyRight = keyFaster = keySlower = false; // stop reacting to held keys once stopped

      engineGain.gain.value = 0; // car has stopped -- cut the engine immediately rather than let it idle forever

      Dom.set('finish_total_time',   formatTime(raceElapsed));
      Dom.set('finish_fastest_lap',  formatTime(Util.toFloat(Dom.storage.fast_lap_time)));
      Dom.addClassName('finish-overlay', 'show');

      Game.stop(); // the track loops forever otherwise -- this is the actual finish line
    }

    //-------------------------------------------------------------------------

    function updateCars(dt, playerSegment, playerW) {
      var n, car, oldSegment, newSegment;
      for(n = 0 ; n < cars.length ; n++) {
        car         = cars[n];
        oldSegment  = findSegment(car.z);
        car.offset  = car.offset + updateCarOffset(car, oldSegment, playerSegment, playerW);
        car.z       = Util.increase(car.z, dt * car.speed, trackLength);
        car.percent = Util.percentRemaining(car.z, segmentLength); // useful for interpolation during rendering phase
        newSegment  = findSegment(car.z);
        if (oldSegment != newSegment) {
          index = oldSegment.cars.indexOf(car);
          oldSegment.cars.splice(index, 1);
          newSegment.cars.push(car);
        }
      }
    }

    function updateCarOffset(car, carSegment, playerSegment, playerW) {

      var i, j, dir, segment, otherCar, otherCarW, lookahead = 20, carW = car.sprite.w * SPRITES.SCALE;

      // optimization, dont bother steering around other cars when 'out of sight' of the player
      if ((carSegment.index - playerSegment.index) > drawDistance)
        return 0;

      for(i = 1 ; i < lookahead ; i++) {
        segment = segments[(carSegment.index+i)%segments.length];

        if ((segment === playerSegment) && (car.speed > speed) && (Util.overlap(playerX, playerW, car.offset, carW, 1.2))) {
          if (playerX > 0.5)
            dir = -1;
          else if (playerX < -0.5)
            dir = 1;
          else
            dir = (car.offset > playerX) ? 1 : -1;
          return dir * 1/i * (car.speed-speed)/maxSpeed; // the closer the cars (smaller i) and the greated the speed ratio, the larger the offset
        }

        for(j = 0 ; j < segment.cars.length ; j++) {
          otherCar  = segment.cars[j];
          otherCarW = otherCar.sprite.w * SPRITES.SCALE;
          if ((car.speed > otherCar.speed) && Util.overlap(car.offset, carW, otherCar.offset, otherCarW, 1.2)) {
            if (otherCar.offset > 0.5)
              dir = -1;
            else if (otherCar.offset < -0.5)
              dir = 1;
            else
              dir = (car.offset > otherCar.offset) ? 1 : -1;
            return dir * 1/i * (car.speed-otherCar.speed)/maxSpeed;
          }
        }
      }

      // if no cars ahead, but I have somehow ended up off road, then steer back on
      if (car.offset < -0.9)
        return 0.1;
      else if (car.offset > 0.9)
        return -0.1;
      else
        return 0;
    }

    //-------------------------------------------------------------------------

    function updateHud(key, value) { // accessing DOM can be slow, so only do it if value has changed
      if (hud[key].value !== value) {
        hud[key].value = value;
        Dom.set(hud[key].dom, value);
      }
    }

    function formatTime(dt) {
      var minutes = Math.floor(dt/60);
      var seconds = Math.floor(dt - (minutes * 60));
      var tenths  = Math.floor(10 * (dt - Math.floor(dt)));
      if (minutes > 0)
        return minutes + "." + (seconds < 10 ? "0" : "") + seconds + "." + tenths;
      else
        return seconds + "." + tenths;
    }

    //=========================================================================
    // RENDER THE GAME WORLD
    //=========================================================================

    function render() {

      var baseSegment   = findSegment(position);
      var basePercent   = Util.percentRemaining(position, segmentLength);
      var playerSegment = findSegment(position+playerZ);
      var playerPercent = Util.percentRemaining(position+playerZ, segmentLength);
      var playerY       = Util.interpolate(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);
      var maxy          = height;

      var x  = 0;
      var dx = - (baseSegment.curve * basePercent);

      ctx.clearRect(0, 0, width, height);

      Render.background(ctx, background, width, height, BACKGROUND.SKY,   skyOffset,  resolution * skySpeed  * playerY);
      Render.background(ctx, background, width, height, BACKGROUND.HILLS, hillOffset, resolution * hillSpeed * playerY);
      Render.background(ctx, background, width, height, BACKGROUND.TREES, treeOffset, resolution * treeSpeed * playerY);

      var n, i, segment, car, sprite, spriteScale, spriteX, spriteY;

      for(n = 0 ; n < drawDistance ; n++) {

        segment        = segments[(baseSegment.index + n) % segments.length];
        segment.looped = segment.index < baseSegment.index;
        segment.fog    = Util.exponentialFog(n/drawDistance, fogDensity);
        segment.clip   = maxy;

        Util.project(segment.p1, (playerX * roadWidth) - x,      playerY + cameraHeight, position - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);
        Util.project(segment.p2, (playerX * roadWidth) - x - dx, playerY + cameraHeight, position - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);

        x  = x + dx;
        dx = dx + segment.curve;

        if ((segment.p1.camera.z <= cameraDepth)         || // behind us
            (segment.p2.screen.y >= segment.p1.screen.y) || // back face cull
            (segment.p2.screen.y >= maxy))                  // clip by (already rendered) hill
          continue;

        Render.segment(ctx, width, lanes,
                       segment.p1.screen.x,
                       segment.p1.screen.y,
                       segment.p1.screen.w,
                       segment.p2.screen.x,
                       segment.p2.screen.y,
                       segment.p2.screen.w,
                       segment.fog,
                       segment.color);

        maxy = segment.p1.screen.y;
      }

      for(n = (drawDistance-1) ; n > 0 ; n--) {
        segment = segments[(baseSegment.index + n) % segments.length];

        for(i = 0 ; i < segment.cars.length ; i++) {
          car         = segment.cars[i];
          sprite      = car.sprite;
          spriteScale = Util.interpolate(segment.p1.screen.scale, segment.p2.screen.scale, car.percent);
          spriteX     = Util.interpolate(segment.p1.screen.x,     segment.p2.screen.x,     car.percent) + (spriteScale * car.offset * roadWidth * width/2);
          spriteY     = Util.interpolate(segment.p1.screen.y,     segment.p2.screen.y,     car.percent);
          Render.sprite(ctx, width, height, resolution, roadWidth, sprites, car.sprite, spriteScale, spriteX, spriteY, -0.5, -1, segment.clip);
        }

        for(i = 0 ; i < segment.sprites.length ; i++) {
          sprite      = segment.sprites[i];
          spriteScale = segment.p1.screen.scale;
          spriteX     = segment.p1.screen.x + (spriteScale * sprite.offset * roadWidth * width/2);
          spriteY     = segment.p1.screen.y;
          Render.sprite(ctx, width, height, resolution, roadWidth, sprites, sprite.source, spriteScale, spriteX, spriteY, (sprite.offset < 0 ? -1 : 0), -1, segment.clip);
        }

        if (segment == playerSegment) {
          Render.player(ctx, width, height, resolution, roadWidth, sprites, speed/maxSpeed,
                        cameraDepth/playerZ,
                        width/2,
                        (height/2) - (cameraDepth/playerZ * Util.interpolate(playerSegment.p1.camera.y, playerSegment.p2.camera.y, playerPercent) * height/2),
                        speed * (keyLeft ? -1 : keyRight ? 1 : 0),
                        playerSegment.p2.world.y - playerSegment.p1.world.y);
        }
      }
    }

    function findSegment(z) {
      return segments[Math.floor(z/segmentLength) % segments.length];
    }

    //=========================================================================
    // BUILD ROAD GEOMETRY
    //=========================================================================

    function lastY() { return (segments.length == 0) ? 0 : segments[segments.length-1].p2.world.y; }

    function addSegment(curve, y) {
      var n = segments.length;
      segments.push({
          index: n,
             p1: { world: { y: lastY(), z:  n   *segmentLength }, camera: {}, screen: {} },
             p2: { world: { y: y,       z: (n+1)*segmentLength }, camera: {}, screen: {} },
          curve: curve,
        sprites: [],
           cars: [],
          color: Math.floor(n/rumbleLength)%2 ? COLORS.DARK : COLORS.LIGHT
      });
    }

    function addSprite(n, sprite, offset) {
      segments[n].sprites.push({ source: sprite, offset: offset });
    }

    function addRoad(enter, hold, leave, curve, y) {
      var startY   = lastY();
      var endY     = startY + (Util.toInt(y, 0) * segmentLength);
      var n, total = enter + hold + leave;
      for(n = 0 ; n < enter ; n++)
        addSegment(Util.easeIn(0, curve, n/enter), Util.easeInOut(startY, endY, n/total));
      for(n = 0 ; n < hold  ; n++)
        addSegment(curve, Util.easeInOut(startY, endY, (enter+n)/total));
      for(n = 0 ; n < leave ; n++)
        addSegment(Util.easeInOut(curve, 0, n/leave), Util.easeInOut(startY, endY, (enter+hold+n)/total));
    }

    var ROAD = {
      LENGTH: { NONE: 0, SHORT:  25, MEDIUM:   50, LONG:  100 },
      HILL:   { NONE: 0, LOW:    20, MEDIUM:   40, HIGH:   60 },
      CURVE:  { NONE: 0, EASY:    2, MEDIUM:    4, HARD:    6 }
    };

    function addStraight(num) {
      num = num || ROAD.LENGTH.MEDIUM;
      addRoad(num, num, num, 0, 0);
    }

    function addHill(num, height) {
      num    = num    || ROAD.LENGTH.MEDIUM;
      height = height || ROAD.HILL.MEDIUM;
      addRoad(num, num, num, 0, height);
    }

    function addCurve(num, curve, height) {
      num    = num    || ROAD.LENGTH.MEDIUM;
      curve  = curve  || ROAD.CURVE.MEDIUM;
      height = height || ROAD.HILL.NONE;
      addRoad(num, num, num, curve, height);
    }

    function addLowRollingHills(num, height) {
      num    = num    || ROAD.LENGTH.SHORT;
      height = height || ROAD.HILL.LOW;
      addRoad(num, num, num,  0,                height/2);
      addRoad(num, num, num,  0,               -height);
      addRoad(num, num, num,  ROAD.CURVE.EASY,  height);
      addRoad(num, num, num,  0,                0);
      addRoad(num, num, num, -ROAD.CURVE.EASY,  height/2);
      addRoad(num, num, num,  0,                0);
    }

    function addSCurves() {
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  -ROAD.CURVE.EASY,    ROAD.HILL.NONE);
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,   ROAD.CURVE.MEDIUM,  ROAD.HILL.MEDIUM);
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,   ROAD.CURVE.EASY,   -ROAD.HILL.LOW);
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  -ROAD.CURVE.EASY,    ROAD.HILL.MEDIUM);
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  -ROAD.CURVE.MEDIUM, -ROAD.HILL.MEDIUM);
    }

    function addBumps() {
      addRoad(10, 10, 10, 0,  5);
      addRoad(10, 10, 10, 0, -2);
      addRoad(10, 10, 10, 0, -5);
      addRoad(10, 10, 10, 0,  8);
      addRoad(10, 10, 10, 0,  5);
      addRoad(10, 10, 10, 0, -7);
      addRoad(10, 10, 10, 0,  5);
      addRoad(10, 10, 10, 0, -2);
    }

    function addDownhillToEnd(num) {
      num = num || 200;
      addRoad(num, num, num, -ROAD.CURVE.EASY, -lastY()/segmentLength);
    }

    function resetRoad() {
      segments = [];

      addStraight(ROAD.LENGTH.SHORT);
      addLowRollingHills();
      addSCurves();
      addCurve(ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.LOW);
      addBumps();
      addLowRollingHills();
      addCurve(ROAD.LENGTH.LONG*2, ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
      addStraight();
      addHill(ROAD.LENGTH.MEDIUM, ROAD.HILL.HIGH);
      addSCurves();
      addCurve(ROAD.LENGTH.LONG, -ROAD.CURVE.MEDIUM, ROAD.HILL.NONE);
      addHill(ROAD.LENGTH.LONG, ROAD.HILL.HIGH);
      addCurve(ROAD.LENGTH.LONG, ROAD.CURVE.MEDIUM, -ROAD.HILL.LOW);
      addBumps();
      addHill(ROAD.LENGTH.LONG, -ROAD.HILL.MEDIUM);
      addStraight();
      addSCurves();
      addDownhillToEnd();

      resetSprites();
      resetCars();

      segments[findSegment(playerZ).index + 2].color = COLORS.START;
      segments[findSegment(playerZ).index + 3].color = COLORS.START;
      for(var n = 0 ; n < rumbleLength ; n++)
        segments[segments.length-1-n].color = COLORS.FINISH;

      trackLength = segments.length * segmentLength;
    }

    function resetSprites() {
      var n, i;

      addSprite(20,  SPRITES.BILLBOARD07, -1);
      addSprite(40,  SPRITES.BILLBOARD06, -1);
      addSprite(60,  SPRITES.BILLBOARD08, -1);
      addSprite(80,  SPRITES.BILLBOARD09, -1);
      addSprite(100, SPRITES.BILLBOARD01, -1);
      addSprite(120, SPRITES.BILLBOARD02, -1);
      addSprite(140, SPRITES.BILLBOARD03, -1);
      addSprite(160, SPRITES.BILLBOARD04, -1);
      addSprite(180, SPRITES.BILLBOARD05, -1);

      addSprite(240,                  SPRITES.BILLBOARD07, -1.2);
      addSprite(240,                  SPRITES.BILLBOARD06,  1.2);
      addSprite(segments.length - 25, SPRITES.BILLBOARD07, -1.2);
      addSprite(segments.length - 25, SPRITES.BILLBOARD06,  1.2);

      for(n = 10 ; n < 200 ; n += 4 + Math.floor(n/100)) {
        addSprite(n, SPRITES.PALM_TREE, 0.5 + Math.random()*0.5);
        addSprite(n, SPRITES.PALM_TREE,   1 + Math.random()*2);
      }

      for(n = 250 ; n < 1000 ; n += 5) {
        addSprite(n,     SPRITES.COLUMN, 1.1);
        addSprite(n + Util.randomInt(0,5), SPRITES.TREE1, -1 - (Math.random() * 2));
        addSprite(n + Util.randomInt(0,5), SPRITES.TREE2, -1 - (Math.random() * 2));
      }

      for(n = 200 ; n < segments.length ; n += 3) {
        addSprite(n, Util.randomChoice(SPRITES.PLANTS), Util.randomChoice([1,-1]) * (2 + Math.random() * 5));
      }

      var side, sprite, offset;
      for(n = 1000 ; n < (segments.length-50) ; n += 100) {
        side      = Util.randomChoice([1, -1]);
        addSprite(n + Util.randomInt(0, 50), Util.randomChoice(SPRITES.BILLBOARDS), -side);
        for(i = 0 ; i < 20 ; i++) {
          sprite = Util.randomChoice(SPRITES.PLANTS);
          offset = side * (1.5 + Math.random());
          addSprite(n + Util.randomInt(0, 50), sprite, offset);
        }

      }

    }

    function resetCars() {
      cars = [];
      var n, car, segment, offset, z, sprite, speed;
      for (var n = 0 ; n < totalCars ; n++) {
        offset = Math.random() * Util.randomChoice([-0.8, 0.8]);
        z      = Math.floor(Math.random() * segments.length) * segmentLength;
        sprite = Util.randomChoice(SPRITES.CARS);
        speed  = maxSpeed/4 + Math.random() * maxSpeed/(sprite == SPRITES.SEMI ? 4 : 2);
        car = { offset: offset, z: z, sprite: sprite, speed: speed };
        segment = findSegment(car.z);
        segment.cars.push(car);
        cars.push(car);
      }
    }

    //=========================================================================
    // THE GAME LOOP
    //=========================================================================

    Game.run({
      canvas: canvas, render: render, update: update, stats: null, step: step,
      images: ["background", "sprites"],
      keys: [
        { keys: [KEY.LEFT,  KEY.A], mode: 'down', action: function() { keyLeft   = true;  } },
        { keys: [KEY.RIGHT, KEY.D], mode: 'down', action: function() { keyRight  = true;  } },
        { keys: [KEY.UP,    KEY.W], mode: 'down', action: function() { keyFaster = true;  } },
        { keys: [KEY.DOWN,  KEY.S], mode: 'down', action: function() { keySlower = true;  } },
        { keys: [KEY.LEFT,  KEY.A], mode: 'up',   action: function() { keyLeft   = false; } },
        { keys: [KEY.RIGHT, KEY.D], mode: 'up',   action: function() { keyRight  = false; } },
        { keys: [KEY.UP,    KEY.W], mode: 'up',   action: function() { keyFaster = false; } },
        { keys: [KEY.DOWN,  KEY.S], mode: 'up',   action: function() { keySlower = false; } }
      ],
      ready: function(images) {
        background = images[0];
        sprites    = images[1];
        reset();
        Dom.storage.fast_lap_time = Dom.storage.fast_lap_time || 180;
        updateHud('fast_lap_time', formatTime(Util.toFloat(Dom.storage.fast_lap_time)));
        Dom.set('total_laps_value', totalLaps);
        updateHud('lap', lapNumber);
        Dom.on('finish-replay', 'click', function() { location.reload(); });

        // Engine loop respects the same mute toggle as music -- common.js's
        // own 'mute' click handler only knows about #music, so this adds a
        // second listener on the same element/event (both fire) rather
        // than touching that shared function. Engine mute is a gain-node
        // value (Web Audio), not an <audio>.muted property.
        collisionSound.muted = engineMuted;
        Dom.on('mute', 'click', function() {
          engineMuted = collisionSound.muted = (Dom.storage.muted === "true");
        });
        // Same deferred-start reasoning as Game.playMusic() in common.js --
        // starting audio here directly gets silently blocked by the
        // browser's autoplay policy since no real gesture has happened
        // yet. Game.onFirstInteraction() fires this at the same
        // genuinely-unlocked moment music starts at.
        Game.onFirstInteraction(startEngineSound);
      }
    });

    function reset(options) {
      options       = options || {};
      canvas.width  = width  = Util.toInt(options.width,          width);
      canvas.height = height = Util.toInt(options.height,         height);
      lanes                  = Util.toInt(options.lanes,          lanes);
      roadWidth              = Util.toInt(options.roadWidth,      roadWidth);
      cameraHeight           = Util.toInt(options.cameraHeight,   cameraHeight);
      drawDistance           = Util.toInt(options.drawDistance,   drawDistance);
      fogDensity             = Util.toInt(options.fogDensity,     fogDensity);
      fieldOfView            = Util.toInt(options.fieldOfView,    fieldOfView);
      segmentLength          = Util.toInt(options.segmentLength,  segmentLength);
      rumbleLength           = Util.toInt(options.rumbleLength,   rumbleLength);
      cameraDepth            = 1 / Math.tan((fieldOfView/2) * Math.PI/180);
      playerZ                = (cameraHeight * cameraDepth);
      resolution             = height/480;
      // No tuning UI on this page (dev.html has it) -- nothing to refresh.

      if ((segments.length==0) || (options.segmentLength) || (options.rumbleLength))
        resetRoad(); // only rebuild road when necessary
    }

    //=========================================================================

  </script>

</body>
</html>
